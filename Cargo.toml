[package]
name = "agentscm"
version = "0.1.0-alpha.5"
edition = "2024"
rust-version = "1.96.0"
license = "FSL-1.1-ALv2"
publish = false

[lints.rust]
warnings = "deny" # CI runs clippy with -D warnings; fail the same way locally

[features]
# Embeds ui/dist (built by `npm run build` in ui/) into the hub; the container image enables it.
ui = []

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
rusqlite = { version = "=0.34.0", features = ["bundled"] }
postgres = "=0.19.14"
getrandom = "=0.4.3"
libc = "=0.2.189"
clap = { version = "=4.5.57", features = ["derive"] }
axum = "=0.8.8"
http-body = "=1.1.0"
hyper = { version = "=1.11.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
tower-service = "=0.3.3"
diffy = { version = "=0.5.2", default-features = false }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
base64 = "=0.22.1"
ring = "=0.17.14"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
toml_edit = "=0.25.17"

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "=0.30.13", default-features = false }
tray-icon = { version = "=0.26.1", default-features = false }
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSAccessibilityProtocols", "NSButton", "NSCell", "NSColor", "NSControl", "NSFont", "NSFontDescriptor", "NSGraphics", "NSImage", "NSImageView", "NSMenu", "NSMenuItem", "NSPanel", "NSParagraphStyle", "NSProgressIndicator", "NSResponder", "NSSwitch", "NSTextField", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSNotification", "NSString", "NSURL"] }

[dev-dependencies]
tempfile = "=3.25.0"
tokio = { version = "=1.53.3", features = ["test-util"] }

[profile.release]
strip = true
lto = "thin"

# Keep line-level diagnostics without full variable debug information.
[profile.dev]
debug = "line-tables-only"

# Packaging integration tests copy the actual CLI. Omit embedded DWARF from test
# executables so debug metadata does not consume the native bundle's 128 MiB limit.
[profile.test]
strip = "debuginfo"

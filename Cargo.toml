[package]
name = "agentscm"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.96.0"
license = "FSL-1.1-ALv2"
publish = false

[lints.rust]
warnings = "deny" # CI runs clippy with -D warnings; fail the same way locally

[features]
# Embeds ui/dist (built by `npm run build` in ui/) into the hub; the container image enables it.
ui = []

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
sha2 = "=0.11.0"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
postgres = "=0.19.14"
getrandom = "=0.4.3"
libc = "=0.2.190"
clap = { version = "=4.6.7", features = ["derive"] }
axum = "=0.8.9"
http-body = "=1.1.0"
diffy = { version = "=0.5.2", default-features = false }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
base64 = "=0.23.1"
ring = "=0.17.14"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
strip = true
lto = "thin"

# Linux embeds DWARF in the binary; full debuginfo makes the test binary exceed the 128 MiB native bundle limit.
[profile.dev]
debug = "line-tables-only"

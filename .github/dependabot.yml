version: 2
updates:
  - package-ecosystem: npm
    directory: "/docs-site"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: "/tools/portable-verifier"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      cargo-verifier:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # The Rust image follows rust-toolchain.toml, and Node stays on the LTS line; bump both by hand.
      - dependency-name: "rust"
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For security issues, do not file here. Use [private vulnerability reporting](https://github.com/counterbranch/agentscm/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `agentscm --version`, or the commit SHA or image digest.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options:
        - Container image
        - Built from source
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands or requests, using synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: Relevant output. Remove secrets, tokens and private repository names.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues.
          required: true
        - label: This is not a security vulnerability.
          required: true

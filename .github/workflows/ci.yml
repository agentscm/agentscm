name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'labeled' && format('label-{0}', github.event.label.name) || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting and lint: on every trigger, including `labeled`, so a label event never records a
  # skipped `static` run that a required check would count as passing.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - name: Check release metadata
        run: |
          rustfmt --edition 2024 --check tools/release-files.rs
          rustc --edition=2024 -D warnings --test tools/release-files.rs -o "$RUNNER_TEMP/release-files-test"
          "$RUNNER_TEMP/release-files-test"
          rustc --edition=2024 -D warnings tools/release-files.rs -o "$RUNNER_TEMP/release-files"
          "$RUNNER_TEMP/release-files" --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Crate-level `warnings = "deny"` turns musl-only deprecations into errors; linting musl here catches
      # them on every pull request. The labelled `release-targets` job builds every non-Windows release target.
      - run: rustup target add x86_64-unknown-linux-musl
      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - run: cargo clippy --locked --target x86_64-unknown-linux-musl -- -D warnings
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc

  # Hosted tests with PostgreSQL and S3. Always on push to main and manual runs. For a pull request:
  # fork PRs run on opened, synchronize and reopened (they cannot carry a local validation
  # attestation); same-repository PRs rely on a signed local validation attestation and run here only
  # with the `ci-extended` label (on labeling, then on every later update while it stays).
  tests:
    if: ${{ github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'ci-extended' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event.action != 'labeled' && (github.event.pull_request.head.repo.full_name != github.repository || contains(github.event.pull_request.labels.*.name, 'ci-extended'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres: # hub store conformance runs against this
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AGENTSCM_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # S3 backend conformance runs against the versitygw container below.
      AGENTSCM_TEST_S3_ENDPOINT: http://127.0.0.1:7070
      AGENTSCM_TEST_S3_BUCKET: agentscm-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest@0.9.148
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Generate throwaway S3 credentials
        run: |
          access=$(openssl rand -hex 10)
          secret=$(openssl rand -hex 20)
          echo "::add-mask::$secret"
          {
            echo "AGENTSCM_TEST_S3_ACCESS_KEY_ID=$access"
            echo "AGENTSCM_TEST_S3_SECRET_ACCESS_KEY=$secret"
          } >> "$GITHUB_ENV"
      - name: Start S3 server (versitygw v1.8.0)
        run: |
          docker run -d --name s3 -p 127.0.0.1:7070:7070 \
            -e ROOT_ACCESS_KEY="$AGENTSCM_TEST_S3_ACCESS_KEY_ID" \
            -e ROOT_SECRET_KEY="$AGENTSCM_TEST_S3_SECRET_ACCESS_KEY" \
            versity/versitygw@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499 \
            --port :7070 --iam-dir /tmp/vgw posix /tmp/vgw
          for _ in $(seq 30); do
            curl -s -o /dev/null "$AGENTSCM_TEST_S3_ENDPOINT/" && exit 0
            sleep 1
          done
          docker logs s3
          exit 1
      - name: Run tests
        run: cargo nextest run --locked
      - name: Run doctests
        if: ${{ !cancelled() }}
        run: cargo test --locked --doc

  # Clippy and release builds for the musl and macOS targets, so a target-specific lint (for example a libc
  # item deprecated only on musl, which the crate-level `warnings = "deny"` turns into an error) fails the
  # pull request instead of release.yml. windows.yml builds the Windows target. Without `--features ui`, which
  # needs the UI build. Same gate as the `windows` job in windows.yml: with the `ci-extended` label, a
  # fork PR once per labelling, and always on push to main and manual runs.
  release-targets:
    if: ${{ github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'ci-extended') || (github.event.action != 'labeled' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'ci-extended')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-unknown-linux-musl, os: ubuntu-24.04, musl: true}
          - {target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true}
          - {target: aarch64-apple-darwin, os: macos-15, musl: false}
          - {target: x86_64-apple-darwin, os: macos-15, musl: false} # cross-compiled on the arm runner, as release.yml does
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # reads rust-toolchain.toml
      - run: rustup target add "$TARGET"
      - name: Install musl-tools
        if: ${{ matrix.musl }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          # ring and bundled SQLite compile C; cc-rs only guesses musl-gcc for x86_64.
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo clippy --locked --target "$TARGET" -- -D warnings
      - run: cargo build --locked --release --target "$TARGET"

name: CI

on:
  # Advisory checks on every pull request; the merge batch stays the only merge gate.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  # Only the warm-cache job runs on main; it saves the Rust cache the pull request and merge batch jobs restore.
  push:
    branches: [main]
  # Release targets run nightly and manually only; the release PR dispatches them.
  schedule:
    - cron: '23 7 * * *'

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The same formatting, Clippy, nextest and doctest commands as the merge batch, so a pull request
  # finds these failures before the queue does. Platform checks below keep their nightly coverage.
  static:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: main # restore only the cache warm-cache saves on main
          save-if: false
      - run: cargo fmt --check
      - name: Check release metadata
        run: |
          rustfmt --edition 2024 --check tools/release-files.rs
          rustc --edition=2024 -D warnings --test tools/release-files.rs -o "$RUNNER_TEMP/release-files-test"
          "$RUNNER_TEMP/release-files-test"
          rustc --edition=2024 -D warnings tools/release-files.rs -o "$RUNNER_TEMP/release-files"
          "$RUNNER_TEMP/release-files" --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  # The one cache pull request and merge batch jobs restore. A merge batch's own ref is thrown away after
  # the run and pull request refs cannot share with each other, so only main's cache is readable by both.
  warm-cache:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # reads rust-toolchain.toml
      - id: cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # One key for every job: the toolchain and Cargo.lock decide it, so main saves once per dependency change.
          shared-key: main
      # Check builds the same dependency artifacts Clippy uses; the test build covers nextest and doctests.
      - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: cargo check --all-targets --locked
      - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: cargo test --no-run --locked

  # Build the tests once; three shards run them from the archive. Doctests run once, here.
  test-build:
    name: test build
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: nextest@0.9.148
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: main # restore only the cache warm-cache saves on main
          save-if: false
      - name: Build test archive
        run: cargo nextest archive --locked --archive-file nextest-archive.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          retention-days: 1
          compression-level: 0 # already zstd
          if-no-files-found: error
      - name: Run doctests
        if: ${{ !cancelled() }}
        run: cargo test --locked --doc

  # PostgreSQL and S3 services in every shard, as in the merge batch.
  test-shard:
    name: test shard ${{ matrix.shard }}/3
    needs: test-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false # a pull request run lists every failure
      matrix:
        shard: [1, 2, 3]
    services:
      postgres: # hub store conformance runs against this
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AGENTSCM_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # S3 backend conformance runs against the versitygw container below.
      AGENTSCM_TEST_S3_ENDPOINT: http://127.0.0.1:7070
      AGENTSCM_TEST_S3_BUCKET: agentscm-ci
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: nextest@0.9.148
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive
          path: ${{ runner.temp }}
      - name: Generate throwaway S3 credentials
        run: |
          access=$(openssl rand -hex 10)
          secret=$(openssl rand -hex 20)
          echo "::add-mask::$secret"
          {
            echo "AGENTSCM_TEST_S3_ACCESS_KEY_ID=$access"
            echo "AGENTSCM_TEST_S3_SECRET_ACCESS_KEY=$secret"
          } >> "$GITHUB_ENV"
      - name: Start S3 server (versitygw v1.8.0)
        run: |
          docker run -d --name s3 -p 127.0.0.1:7070:7070 \
            -e ROOT_ACCESS_KEY="$AGENTSCM_TEST_S3_ACCESS_KEY_ID" \
            -e ROOT_SECRET_KEY="$AGENTSCM_TEST_S3_SECRET_ACCESS_KEY" \
            versity/versitygw@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499 \
            --port :7070 --iam-dir /tmp/vgw posix /tmp/vgw
          for _ in $(seq 30); do
            curl -s -o /dev/null "$AGENTSCM_TEST_S3_ENDPOINT/" && exit 0
            sleep 1
          done
          docker logs s3
          exit 1
      # Extracting into the checkout puts target/ where the build had it, so env!("CARGO_BIN_EXE_agentscm") resolves.
      - name: Run tests
        run: cargo nextest run --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst" --extract-to "$GITHUB_WORKSPACE" --partition "count:$SHARD/3"

  # The check name tools look for; it fails unless the build and every shard passed.
  tests:
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
    needs: [test-build, test-shard]
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - env:
          BUILD: ${{ needs.test-build.result }}
          SHARDS: ${{ needs.test-shard.result }}
        run: test "$BUILD" = success && test "$SHARDS" = success

  # Clippy and release builds for the musl and macOS targets, so a target-specific lint (for example a libc
  # item deprecated only on musl, which the crate-level `warnings = "deny"` turns into an error) fails the
  # nightly, manual and release-branch dispatch runs before release.yml. windows.yml builds the Windows target.
  # Without `--features ui`, which needs the UI build. Runs on scheduled and manual runs, like the `windows` job in windows.yml.
  release-targets:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-unknown-linux-musl, os: ubuntu-24.04, musl: true}
          - {target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true}
          - {target: aarch64-apple-darwin, os: macos-15, musl: false}
          - {target: x86_64-apple-darwin, os: macos-15, musl: false} # cross-compiled on the arm runner, as release.yml does
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # reads rust-toolchain.toml
      - run: rustup target add "$TARGET"
      - name: Install musl-tools
        if: ${{ matrix.musl }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          # ring and bundled SQLite compile C; cc-rs only guesses musl-gcc for x86_64.
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo clippy --locked --target "$TARGET" -- -D warnings
      - run: cargo build --locked --release --target "$TARGET"

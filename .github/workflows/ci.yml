name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres: # hub store conformance runs against this
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AGENTSCM_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # S3 backend conformance runs against the versitygw container below.
      AGENTSCM_TEST_S3_ENDPOINT: http://127.0.0.1:7070
      AGENTSCM_TEST_S3_BUCKET: agentscm-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest@0.9.148
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Generate throwaway S3 credentials
        run: |
          access=$(openssl rand -hex 10)
          secret=$(openssl rand -hex 20)
          echo "::add-mask::$secret"
          {
            echo "AGENTSCM_TEST_S3_ACCESS_KEY_ID=$access"
            echo "AGENTSCM_TEST_S3_SECRET_ACCESS_KEY=$secret"
          } >> "$GITHUB_ENV"
      - name: Start S3 server (versitygw v1.8.0)
        run: |
          docker run -d --name s3 -p 127.0.0.1:7070:7070 \
            -e ROOT_ACCESS_KEY="$AGENTSCM_TEST_S3_ACCESS_KEY_ID" \
            -e ROOT_SECRET_KEY="$AGENTSCM_TEST_S3_SECRET_ACCESS_KEY" \
            versity/versitygw@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499 \
            --port :7070 --iam-dir /tmp/vgw posix /tmp/vgw
          for _ in $(seq 30); do
            curl -s -o /dev/null "$AGENTSCM_TEST_S3_ENDPOINT/" && exit 0
            sleep 1
          done
          docker logs s3
          exit 1
      - name: Run tests
        run: cargo nextest run --locked
      - name: Run doctests
        if: ${{ !cancelled() }}
        run: cargo test --locked --doc

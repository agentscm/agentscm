name: Merge admission

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] trusted workflow source only; no candidate checkout or execution
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_run: # zizmor: ignore[dangerous-triggers] API results only; never downloads candidate artifacts
    # CI completion re-evaluates admission, so a queued pull request enters once static and tests pass.
    workflows: [Local validation verifier, Conventional PR title, CI]
    types: [requested, in_progress, completed]

permissions: {}

jobs:
  admission:
    # A CI start is skipped: the pull request's own event already set its head pending. A newer pending
    # run replaces an older one in a group, and the docs do not say whether a job skipped by `if` joins
    # it, so a skipped CI start gets a group of its own and can never displace a queued sweep.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.name != 'CI' || github.event.action == 'completed' }}
    concurrency:
      group: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'CI' && github.event.action != 'completed') && format('merge-admission-skip-{0}', github.run_id) || 'merge-admission' }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write # the gate is also reported as a commit status on each PR head
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {execFileSync} = require('node:child_process');
            const {admit} = require('./.github/scripts/merge-admission.cjs');
            await admit({github, context, validateTitle: title => {
              try {
                execFileSync('python3', ['.github/scripts/validate_pr_title.py', title], {stdio: 'pipe', timeout: 5000});
                return true;
              } catch { return false; }
            }});

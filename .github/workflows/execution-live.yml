name: Execution live

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: &paths
      - src/execution.rs
      - src/execution/**
      - src/checks.rs
      - src/authority.rs
      - src/context.rs
      - src/lib.rs
      - src/store.rs
      - src/model.rs
      - src/error.rs
      - tests/integration/main.rs
      - tests/integration/execution.rs
      - tests/integration/command_checks.rs
      - tests/integration/execution_canaries.rs
      - tests/integration/common/fake_docker.rs
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/execution-live.yml
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: execution-live-${{ github.ref }}-${{ github.event.action == 'labeled' && format('label-{0}', github.event.label.name) || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # busybox:1.37.0 multi-platform index, pinned; nothing else is pulled.
  BUSYBOX: busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e

jobs:
  # Runs the opt-in real-runtime execution tests against the runner's own Docker daemon.
  # Synthetic source only; no credentials, registries or providers beyond the pinned image pull.
  oci:
    # Gate for cost and abuse control, not isolation: fork code can run on any hosted runner, which is
    # ephemeral and has a read-only token and no secrets. Pushes to main and manual runs always pass.
    # A pull request runs this job only when a maintainer adds the `ci-extended` label (same-repository
    # PRs rely on a local validation attestation otherwise). A fork PR runs once per labelling, against
    # the head at that moment; pushing again does not re-run it. A same-repository PR also re-runs on
    # each update while the label stays. Remove and re-add the label to run a fork PR again.
    if: ${{ github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'ci-extended') || (github.event.action != 'labeled' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'ci-extended')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Acquire pinned image
        run: |
          docker pull --quiet "$BUSYBOX"
          echo "AGENTSCM_OCI_IMAGE=$(docker image inspect --format '{{.Id}}' "$BUSYBOX")" >> "$GITHUB_ENV"
      - name: Record runtime identity
        shell: bash
        run: |
          set -o pipefail
          docker version
          docker info --format '{{json .}}' | jq '{ServerVersion, KernelVersion, OperatingSystem, CgroupVersion, DefaultRuntime, SecurityOptions}'
      - name: Live execution tests
        env:
          AGENTSCM_DOCKER: /usr/bin/docker
          AGENTSCM_DOCKER_SOCKET: /var/run/docker.sock
        # libtest filters are substrings, so `execution::` also matches any module whose name ends
        # in `execution`; re-check `--list` output when adding ignored tests to other modules.
        run: |
          cargo test --locked --no-fail-fast --test integration -- --ignored --test-threads=1 --nocapture execution:: command_checks:: execution_canaries::

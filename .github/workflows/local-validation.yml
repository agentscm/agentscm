name: Local validation verifier

# Reconciles the `agentscm/local-validation` commit status of every open pull request on the
# default branch from maintainer-signed attestation comments. It calls the reusable verifier,
# which installs an exact published, provenance-checked release and runs
# `agentscm local-validation reconcile`; nothing in this repository is built. Pull request heads
# are fetched as Git data and are never checked out, built or run. Policy, recipe and registry
# come from the default branch checkout. It also runs on pull request events so a head that
# changes only exempt paths gets its status promptly.

on:
  issue_comment: # zizmor: ignore[dangerous-triggers] default-branch code only; the PR head is fetched as Git data, never built or run
    types: [created, edited, deleted]
  pull_request_target: # zizmor: ignore[dangerous-triggers] default-branch code only; the PR head is fetched as Git data, never built or run
    types: [opened, synchronize, reopened, edited] # edited runs only for a base change, see the reusable job's `if:`
  push:
    branches: [main]
    paths:
      - ".github/local-validation/**"
      - ".github/workflows/local-validation.yml"
  schedule:
    - cron: '17 6 * * *' # replaces the success of an aged-out attestation on the head

permissions: {}

jobs:
  reconcile:
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    # v0.2.1. Bump the SHA and release-version together; tools/attest-pr.sh reads release-version
    # so the local producer runs the same binary. See docs/releasing.md before bumping.
    uses: agentscm/agentscm/.github/workflows/local-validation-reconcile.yml@5cd629e46a895655a404ccb5baa33e30859dfdb8
    with:
      release-version: 0.2.1
      config-dir: .github/local-validation
      verifier-workflow: .github/workflows/local-validation.yml
      github-authenticated-fetch: false

name: Local validation verifier

# Reconciles the `agentscm/local-validation` commit status of every open pull request on the
# default branch from maintainer-signed attestation comments. It builds only the default
# branch; pull request heads are fetched as Git data by `agentscm local-validation reconcile`
# and are never checked out, built or run. Policy, recipe and registry come from the default
# branch checkout.

on:
  issue_comment: # zizmor: ignore[dangerous-triggers] default-branch build only; the PR head is fetched as Git data, never built or run
    types: [created, edited, deleted]
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/local-validation/**"
      - ".github/workflows/local-validation.yml"
  schedule:
    - cron: '17 6 * * *' # replaces the success of an aged-out attestation on the head

permissions: {}

# Every run reconciles all open pull requests, so a queued run supersedes intermediate ones.
concurrency:
  group: local-validation
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  reconcile:
    # For comments: only pull request comments from trusted associations that start with the
    # attestation marker, or that did before an edit removed it so the old success is replaced
    # (the signature still decides; this limits compute abuse and replay).
    if: ${{ github.event_name != 'issue_comment' || (github.event.issue.pull_request && (startsWith(github.event.comment.body, '<!-- agentscm-local-validation:v1 ') || (github.event.action == 'edited' && startsWith(github.event.changes.body.from, '<!-- agentscm-local-validation:v1 '))) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked --bin agentscm
      - name: Reconcile statuses
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: target/debug/agentscm local-validation reconcile --github-repo "$REPO" --base "$DEFAULT_BRANCH" --target-url "$RUN_URL"

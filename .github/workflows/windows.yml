name: Windows

on:
  # Pull requests run the `check` job, and the full build and tests too when they change src/client*. Those also run nightly and on dispatch.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: '43 7 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Proves the crate compiles on Windows on every pull request. Type checking without codegen or linking
  # finishes well inside the Linux tests job; the `windows` job below still builds, links and tests.
  check:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash # Git Bash on the Windows runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main (the nightly run) saves, so every pull request restores one shared cache and none evicts another.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The same targets the `windows` job tests; the other integration tests use Unix-only APIs.
      - run: cargo check --locked --lib --bin agentscm --test integration
      # The `#[cfg(test)]` unit-test modules in src/, which `cargo test` compiles in the `windows` job.
      - run: cargo check --locked --profile test --lib --bin agentscm

  # Client code has Windows-only paths that type checking cannot catch (#636), so its pull requests run the full tests.
  changes:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      client: ${{ steps.diff.outputs.client }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only | grep -q '^src/client'; then
            echo client=true >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.client == 'true') }}
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: bash # Git Bash on the Windows runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --release
      - run: target/release/agentscm.exe --version
      - name: Test
        env:
          # This job has no PostgreSQL: the postgres variants skip instead of failing under CI=true.
          CI: "false"
        # tests/integration/main.rs compiles only the modules that are meaningful on Windows; the rest use Unix-only APIs.
        run: cargo test --locked --no-fail-fast --lib --bin agentscm --test integration

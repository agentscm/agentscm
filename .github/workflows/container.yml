name: Container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux/amd64, arch: amd64, runner: ubuntu-24.04}
          - {platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build on native hardware
        run: docker build --platform "${{ matrix.platform }}" -t "agentscm:ci-${{ matrix.arch }}" .
      - name: Confirm the loaded image architecture
        run: test "$(docker image inspect --format '{{.Architecture}}/{{.Os}}' 'agentscm:ci-${{ matrix.arch }}')" = "${{ matrix.arch }}/linux"
      - name: Smoke test
        run: .github/docker-smoke.sh "agentscm:ci-${{ matrix.arch }}" # build and smoke test only; nothing is pushed

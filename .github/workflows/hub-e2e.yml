name: Hub end-to-end

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "src/hub/**"
      - "src/hub_cli.rs"
      - "src/intent_cli.rs"
      - "src/backend.rs"
      - "src/backend_s3.rs"
      - "src/lib.rs"
      - "src/main.rs"
      - "examples/hub_seed.rs"
      - "Dockerfile"
      - "compose.hub.yaml"
      - ".github/compose.e2e.yaml"
      - ".github/hub-e2e.sh"
      - ".github/workflows/hub-e2e.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'labeled' && format('label-{0}', github.event.label.name) || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hub-e2e:
    # Gate for cost and abuse control, not isolation: fork code can run on any hosted runner, which is
    # ephemeral and has a read-only token and no secrets. Pushes to main and manual runs always pass.
    # A pull request runs this job only when a maintainer adds the `ci-extended` label (same-repository
    # PRs rely on a local validation attestation otherwise). A fork PR runs once per labelling, against
    # the head at that moment; pushing again does not re-run it. A same-repository PR also re-runs on
    # each update while the label stays. Remove and re-add the label to run a fork PR again.
    if: ${{ github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'ci-extended') || (github.event.action != 'labeled' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'ci-extended')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/hub-e2e.sh default
      - if: ${{ !cancelled() }} # report a postgres-profile failure even when the default one failed
        run: .github/hub-e2e.sh postgres

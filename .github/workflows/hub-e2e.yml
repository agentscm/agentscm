name: Hub end-to-end

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/hub/migrations/*.pg.sql"
      - "src/hub/migrations/named/*.pg.sql"
      - "src/hub/store_pg.rs"
      - "examples/hub_seed.rs"
      - "Dockerfile"
      - "compose.hub.yaml"
      - ".github/compose.e2e.yaml"
      - ".github/hub-e2e.sh"
      - ".github/workflows/hub-e2e.yml"
  workflow_dispatch:
  # Nightly and manual runs cover everything else; the release PR dispatches it.
  schedule:
    - cron: '13 8 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hub-e2e:
    # Fork code never starts automatically: skip pull requests from other repositories.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/hub-e2e.sh default
      - if: ${{ !cancelled() }} # report a postgres-profile failure even when the default one failed
        run: .github/hub-e2e.sh postgres

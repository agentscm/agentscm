nextest-version = { required = "0.9.148", recommended = "0.9.148" }

[profile.default]
fail-fast = false
retries = 0

# The merge batch gate stops at the first failure; pull request runs keep the default and list them all.
# Inherits everything else, including the default profile's test-group overrides.
[profile.gate]
fail-fast = true

[profile.default.junit]
path = "junit.xml"
report-skipped = "ignored"

[test-groups]
backend-s3 = { max-threads = 1 }
hub-worktree-lifecycle = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'binary(integration) & test(/^backend_s3::/)'
test-group = 'backend-s3'

[[profile.default.overrides]]
filter = 'binary(integration) & test(/^hub_workspace_execution::two_git_worktrees_/)'
test-group = 'hub-worktree-lifecycle'

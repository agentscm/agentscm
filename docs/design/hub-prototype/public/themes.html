<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
  <link rel="icon" href="logo-mark.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub themes</title>
<script>
  // Set the theme before first paint so there is no light flash in dark mode. Only known values are applied:
  // these come from the URL or storage and end up in attributes the page reads back.
  (function () { var q = new URLSearchParams(location.search), get = function (k, key) { var v = q.get(k); if (v === null) { try { v = localStorage.getItem(key); } catch (e) {} } return v; };
    var t = get('mode', 'hubstory.theme'); if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-bs-theme', t);
    if (get('density', 'agentscm.hub.density') === 'condensed') document.documentElement.setAttribute('data-density', 'condensed');
    var s = get('skin', 'agentscm.hub.skin'); if (['dusk', 'mist', 'twilight', 'graphite', 'glance'].indexOf(s) >= 0) document.documentElement.setAttribute('data-skin', s); })();
</script>
<link rel="stylesheet" href="vendor/bootstrap.min.css">
<link rel="stylesheet" href="vendor/bootstrap-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@300;400;500;600;700&family=Schibsted+Grotesk:wght@400;500;600;700&family=Unbounded:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="hub.css">
<link rel="stylesheet" href="skins.css">
</head>
<body class="compare-page">
<header class="compare-head">
  <a href="./" class="brand"><img src="logo-full.png" alt="AgentSCM" class="logo logo-full" width="119" height="28"></a>
  <h1>Twilight: spacious and condensed</h1>
  <div class="filters" role="group" aria-label="Page to compare">
    <button type="button" class="btn btn-sm active" data-route="#/home/now">Now</button>
    <button type="button" class="btn btn-sm" data-route="#/home/where">Where</button>
    <button type="button" class="btn btn-sm" data-route="#/home/catchup">Catch up</button>
    <button type="button" class="btn btn-sm" data-route="#/home/team">Team</button>
    <button type="button" class="btn btn-sm" data-route="#/inbox">Inbox</button>
    <button type="button" class="btn btn-sm" data-route="#/task/W-41">Task page</button>
    <button type="button" class="btn btn-sm" data-route="#/history">History</button>
  </div>
</header>
<div class="compare">
  <section><div class="compare-label"><b>1</b> Spacious <span>light</span><button type="button" class="btn btn-sm btn-link" data-use="spacious" data-mode-use="light">Use this</button></div><div class="frame"><iframe data-skin="twilight" data-density="spacious" data-mode="light" title="Twilight, spacious, light"></iframe></div></section>
  <section><div class="compare-label"><b>2</b> Condensed <span>light</span><button type="button" class="btn btn-sm btn-link" data-use="condensed" data-mode-use="light">Use this</button></div><div class="frame"><iframe data-skin="twilight" data-density="condensed" data-mode="light" title="Twilight, condensed, light"></iframe></div></section>
  <section><div class="compare-label"><b>3</b> Spacious <span>dark</span><button type="button" class="btn btn-sm btn-link" data-use="spacious" data-mode-use="dark">Use this</button></div><div class="frame"><iframe data-skin="twilight" data-density="spacious" data-mode="dark" title="Twilight, spacious, dark"></iframe></div></section>
</div>
<script type="module">
  let route = '#/home/now';
  const load = () => document.querySelectorAll('iframe').forEach(f => { f.src = `./?embed&skin=${f.dataset.skin}&density=${f.dataset.density}&mode=${f.dataset.mode}&r=${Date.now()}${route}`; });
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-route]');
    if (b) { route = b.dataset.route; document.querySelectorAll('[data-route]').forEach(x => x.classList.toggle('active', x === b)); load(); }
    const m = e.target.closest('[data-mode]');
    if (m) { try { localStorage.setItem('hubstory.theme', m.dataset.mode); } catch {} document.documentElement.setAttribute('data-bs-theme', m.dataset.mode); load(); }
    const u = e.target.closest('[data-use]');
    if (u) { try { localStorage.setItem('agentscm.hub.skin', 'twilight'); localStorage.setItem('agentscm.hub.density', u.dataset.use); localStorage.setItem('hubstory.theme', u.dataset.modeUse); } catch {} location.href = './'; }
  });
  const fit = () => document.querySelectorAll('.frame').forEach(f => { const s = f.clientWidth / 1180; const i = f.querySelector('iframe'); i.style.width = '1180px'; i.style.transform = `scale(${s})`; i.style.height = `${f.clientHeight / s}px`; });
  addEventListener('resize', fit); fit(); load();
</script>
</body>
</html>

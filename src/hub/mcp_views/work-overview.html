<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work overview</title>
<style>
:root{--frame:#17142e;--ink:#ece9ff;--dim:#aaa5d2;--hi:#b3abff;--coral:#ff9c84;--green:#6fdba6;--amber:#f6bd7a;--line:rgba(255,255,255,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark}}:root[data-theme=dark]{color-scheme:dark}:root[data-theme=light]{color-scheme:light}
/* Reserve the scrollbar's width so a scrollbar appearing cannot rewrap text and change the height sent in size-changed. */
html{scrollbar-gutter:stable}*{box-sizing:border-box}body{margin:0;padding:4px;background:transparent;color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.c{position:relative;overflow:hidden;background:var(--frame);border-radius:20px;padding:16px 18px 12px}
.c::before{content:"";position:absolute;right:-80px;top:-120px;width:300px;height:300px;border-radius:50%;background:radial-gradient(closest-side,rgba(109,92,224,.45),transparent);pointer-events:none}
.c>*{position:relative}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bad{color:var(--coral)}.warn{color:var(--amber)}.go{color:var(--hi)}.ok{color:var(--green)}
.top{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim)}.top .sp{flex:1}.top>span:nth-child(2){overflow-wrap:anywhere}.top>span:nth-child(4){white-space:nowrap}
.live{width:7px;height:7px;flex:none;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(111,219,166,.15)}.live.off{background:var(--amber);box-shadow:0 0 0 4px rgba(246,189,122,.15)}
.ib{display:inline-grid;place-items:center;flex:none;width:30px;height:30px;border:0;border-radius:9px;background:transparent;color:var(--dim);cursor:pointer}.ib:hover{background:rgba(255,255,255,.08);color:#fff}
button:focus-visible,summary:focus-visible{outline:2px solid var(--hi);outline-offset:2px;border-radius:6px}
.msg{display:flex;gap:8px;align-items:flex-start;margin:8px 0;font-size:12.5px;color:var(--dim)}.msg .i{width:14px;height:14px;margin-top:2px}.msg.warn{color:var(--amber)}.msg.bad{color:var(--coral)}
.note{margin:6px 0;font-size:12.5px;color:var(--dim)}.mut{color:var(--dim)}
ul{margin:0;padding:0;list-style:none}
details.f{border-top:1px solid var(--line)}details.f>summary{display:flex;align-items:center;gap:8px;padding:10px 0;cursor:pointer;list-style:none;font-weight:500;font-size:13.5px}details.f>summary::-webkit-details-marker{display:none}
.chev{color:var(--dim);transition:transform .2s}details[open]>summary>.chev{transform:rotate(90deg)}
.n{margin-left:auto;font-size:12px;font-weight:400;color:var(--dim);text-align:right}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-top:2px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}.foot span{display:inline-flex;gap:5px;align-items:center}.foot .i{width:13px;height:13px}
@media (max-width:420px){.c{padding:14px 14px 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.big{margin:12px 0 6px;font-size:24px;font-weight:300;letter-spacing:-.02em;line-height:1.25}.big em{font-style:normal;color:var(--coral);font-weight:400}
.needs li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:0 10px;padding:9px 0;border-top:1px solid var(--line)}.needs .i{margin-top:3px}.needs .t{font-weight:500;overflow-wrap:anywhere}.needs .s{grid-column:2;font-size:12.5px;color:var(--dim);overflow-wrap:anywhere}
.w li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:1px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}.w li:first-child{border-top:0}
.ag{width:10px;height:10px;border-radius:3px;background:var(--c)}.w .t{font-size:13.5px;font-weight:500;overflow-wrap:anywhere}.w .s{grid-column:2/-1;font-size:12px;color:var(--dim);overflow-wrap:anywhere}.w .st{font-size:12px;font-weight:500;color:var(--dim)}
.sh{margin:10px 0 2px;font-size:12px;color:var(--dim)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style></head><body><div class="c" id="app"></div><div id="live" class="sr" role="status" aria-live="polite"></div>
<script>
"use strict";
var TOOL='agentscm_work_overview';
var NS='http://www.w3.org/2000/svg',OPEN={};
var IC={alert:['M2 8a6 6 0 1 0 12 0a6 6 0 1 0-12 0','M8 5v3.4','M8 11h.01'],block:['M2 8a6 6 0 1 0 12 0a6 6 0 1 0-12 0','M4 12 12 4'],hand:['M2.5 6h9M9 3.5 11.5 6 9 8.5','M13.5 10h-9M7 7.5 4.5 10 7 12.5'],pause:['M2 8a6 6 0 1 0 12 0a6 6 0 1 0-12 0','M6.6 6v4M9.4 6v4'],overlap:['M2.4 8a3.6 3.6 0 1 0 7.2 0a3.6 3.6 0 1 0-7.2 0','M6.4 8a3.6 3.6 0 1 0 7.2 0a3.6 3.6 0 1 0-7.2 0'],move:['M2.5 8h8M8 4.5 11.5 8 8 11.5'],refresh:['M13 8a5 5 0 1 1-1.5-3.6','M13 2.5v3h-3'],chev:['M6 3.5 10.5 8 6 12.5'],check:['M3.5 8.5 6.5 11.5 12.5 4.5'],reply:['M6.5 4 2.5 8l4 4','M2.5 8H9a4.5 4.5 0 0 1 4.5 4.5'],arrow:['M3 8h9M9 5l3 3-3 3']};
function ic(k,cls){var s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 16 16');s.setAttribute('class','i'+(cls?' '+cls:''));s.setAttribute('aria-hidden','true');IC[k].forEach(function(d){var p=document.createElementNS(NS,'path');p.setAttribute('d',d);s.appendChild(p)});return s}
function h(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=String(text);return e}
function add(p){for(var i=1;i<arguments.length;i++){var a=arguments[i];if(a)p.appendChild(typeof a==='string'?document.createTextNode(a):a)}return p}
function clip(s){s=String(s==null?'':s);return s.length>300?s.slice(0,300)+'…':s}
function pad(n){return n<10?'0'+n:''+n}
function hms(d){return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
function ago(at){var s=Math.max(0,Math.floor(Date.now()/1000-at));if(s<60)return 'just now';var m=Math.floor(s/60);if(m<60)return m+' min ago';var x=Math.floor(m/60);return x<24?x+' h ago':Math.floor(x/24)+' d ago'}
function msg(tone,text){return add(h('p','msg '+tone),ic('alert'),h('span',null,text))}
function keep(d,s,key){d.open=!!OPEN[key];s.setAttribute('data-k',key);d.addEventListener('toggle',function(){OPEN[key]=d.open;size()})}
function fold(key,label,meta){var d=h('details','f'),s=h('summary');keep(d,s,key);add(s,ic('chev','chev'),h('span',null,label),meta?h('span','n',meta):null);d.appendChild(s);return d}
function bar(label,meta){var t=h('div','top');add(t,h('span','live'+(failedAt?' off':'')),h('span',null,label),h('span','sp'),meta?h('span',null,meta):null,refreshBtn());return t}
function refreshBtn(){var b=h('button','ib');b.type='button';b.setAttribute('aria-label','Refresh');b.setAttribute('data-k','refresh');b.title='Refresh';b.appendChild(ic('refresh'));b.addEventListener('click',onRefresh);return b}
function failNote(){return failedAt?msg('warn','Could not refresh. Showing data from '+hms(failedAt)):null}
var nextId=1,pending={},last=null,lastAt=null,lastH=0,failedAt=null;
function send(m){window.parent.postMessage(m,'*')}
function rpc(method,params){return new Promise(function(ok,no){var id=nextId++;pending[id]={ok:ok,no:no};send({jsonrpc:'2.0',id:id,method:method,params:params})})}
function parse(r){if(!r||r.isError)return null;var s=r.structuredContent;if(s&&typeof s==='object')return s;var c=r.content;if(c&&c[0]&&typeof c[0].text==='string'){try{var v=JSON.parse(c[0].text);if(v&&typeof v==='object')return v}catch(e){}}return null}
function theme(c){if(c&&(c.theme==='dark'||c.theme==='light'))document.documentElement.setAttribute('data-theme',c.theme)}
function size(){var v=Math.ceil(document.body.scrollHeight);if(v!==lastH){lastH=v;send({jsonrpc:'2.0',method:'ui/notifications/size-changed',params:{height:v}})}}
function paint(){var root=document.getElementById('app'),sc=document.documentElement,y=sc.scrollTop,a=document.activeElement,k=a&&root.contains(a)?a.getAttribute('data-k'):null;root.textContent='';if(!last){add(root,h('p','note','No data returned.'))}else render(root,last,lastAt);sc.scrollTop=y;if(k)Array.prototype.some.call(root.querySelectorAll('[data-k]'),function(n){if(n.getAttribute('data-k')!==k)return false;n.focus({preventScroll:true});return true});size()}
var AUTO={base:30000,max:300000,fails:0,t:null,at:Date.now(),busy:false,q:null,seen:true,gist:null,args:{}};
function on(){return !document.hidden&&AUTO.seen}
function plan(){clearTimeout(AUTO.t);AUTO.t=on()?setTimeout(tick,Math.max(0,AUTO.at+Math.min(AUTO.max,AUTO.base*Math.pow(2,AUTO.fails))-Date.now())):null}
function tick(){AUTO.t=null;if(on())call(AUTO.args,true)}
function say(t){var l=document.getElementById('live');if(l)l.textContent=t}
function got(d,args){last=d;lastAt=new Date();failedAt=null;AUTO.args=args;paint();var g=gist();if(g&&AUTO.gist&&g!==AUTO.gist)say('Updated: '+g);AUTO.gist=g}
function take(r){var d=parse(r);if(d){got(d,{});AUTO.at=Date.now();AUTO.fails=0;plan()}else if(!last)paint()}
function fail(){failedAt=lastAt;paint()}
function done(ok){AUTO.busy=false;AUTO.at=Date.now();AUTO.fails=ok===true?0:Math.min(AUTO.fails+1,6);var q=AUTO.q;AUTO.q=null;if(q)call(q);else plan()}
function call(args,auto){if(AUTO.busy){if(!auto)AUTO.q=args;return}AUTO.busy=true;
rpc('tools/call',{name:TOOL,arguments:args}).then(function(r){var d=parse(r);if(d){got(d,args)}else fail();return !!d}).catch(function(){fail();return false}).then(done,done)}
window.addEventListener('message',function(e){if(e.source!==window.parent)return;var m=e.data;if(!m||m.jsonrpc!=='2.0')return;
if(m.id!=null&&pending[m.id]&&!m.method){var p=pending[m.id];delete pending[m.id];if(m.error)p.no(m.error);else p.ok(m.result);return}
if(m.method==='ui/notifications/tool-result')take(m.params);
else if(m.method==='ui/notifications/host-context-changed')theme(m.params&&(m.params.theme?m.params:m.params.hostContext))});
var manage='Manage these views: ask your agent to run agentscm_view_settings, or open Settings in the hub.';
function start(){if(typeof ResizeObserver==='function')new ResizeObserver(size).observe(document.body);
if(typeof IntersectionObserver==='function')new IntersectionObserver(function(es){AUTO.seen=es[es.length-1].isIntersecting;plan()}).observe(document.body);
document.addEventListener('visibilitychange',plan);
rpc('ui/initialize',{appInfo:{name:TOOL+'-view',version:'1.0.0'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(function(r){theme(r&&r.hostContext);send({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}})},function(){});
paint();plan()}
var STATE={active:['Working','move','go'],blocked:['Blocked','block','bad'],handover:['Handover','hand','warn'],paused:['Paused','pause','']};
var NAMES={'claude-code':'Claude Code',codex:'Codex',cursor:'Cursor',copilot:'Copilot',gemini:'Gemini'},AGC={'claude-code':'#e8896a',codex:'#ece9ff',cursor:'#9a97b8',copilot:'#8b7cf0',gemini:'#6aa0ff'};
function own(o,k){return typeof k==='string'&&Object.prototype.hasOwnProperty.call(o,k)}
function who(i){var a=i.lead_agent;return a?own(NAMES,a)?NAMES[a]:a:i.owner_login||'unknown agent'}
function agc(i){return own(AGC,i.lead_agent)?AGC[i.lead_agent]:'#aaa5d2'}
function plural(n,a,b){return n+' '+(n===1?a:b||a+'s')}
function workRow(i,word,tone,sub){var li=h('li'),sw=h('span','ag');sw.style.setProperty('--c',agc(i));add(li,sw,h('span','t',clip(i.title)),h('span','st '+tone,word),h('span','s',sub));return li}
function render(root,d,at){
var s=d.actionable_status;
add(root,bar('AgentSCM · '+clip(s&&s.repository||'Work overview'),'Read '+pad(at.getHours())+':'+pad(at.getMinutes())),failNote());
if(!s||!Array.isArray(s.work)||!s.counts){add(root,msg('warn','Shared status unavailable. Refresh or ask your agent for current work status.'));return}
var c=s.counts;
add(root,h('p','big',plural(c.active,'active task')+'. '+plural(c.needs_you,'action needs','actions need')+' you.'));
add(root,h('p','note',c.awaiting_party+' awaiting a named party · '+c.blocked+' blocked · '+c.reassessment_needed+' reassessment needed · '+c.held_reservations+' held reservations'));
if(!s.complete)add(root,msg('warn','Coverage incomplete; missing signals remain unknown.'));
function recipient(r){return r&&r.login?r.login+(r.kind==='lead_agent'?'’s agent':''):r&&r.kind==='none'?'No action assigned':'Recipient unknown'}
var rows=h('ul','needs');
s.work.filter(function(w){return w.needs_you}).forEach(function(w){var li=h('li');add(li,ic('alert','warn'),h('span','t',clip(w.title)),h('span','s',recipient(w.recipient)+' · '+clip(w.action)));rows.appendChild(li)});
(s.actions||[]).filter(function(a){return a.needs_you}).forEach(function(a){var li=h('li');add(li,ic('hand','warn'),h('span','t',clip(a.action)),h('span','s',(a.recipients||[]).map(recipient).join(', ')));rows.appendChild(li)});
add(root,rows);
var all=fold('all','All work and evidence',plural(s.work.length,'task')),wl=h('ul','w');
s.work.forEach(function(w){var sub=recipient(w.recipient)+' · '+clip(w.action)+' · Claim '+w.freshness+' · Reservation '+w.operational.reservation.status;
if(w.operational.report)sub+=' · Agent report '+w.operational.report.kind+' at '+w.operational.report.at;
var r=w.reconciliation;
if(r){(r.current_source_coverage||[]).forEach(function(p){sub+=' · '+p.source+': '+p.state+'; checked '+p.checked_at_seconds});if(!r.current)sub+=' · No current reconciliation synthesis'}else sub+=' · Provider coverage unavailable';
if(w.limits&&w.limits.length)sub+=' · Coverage: '+w.limits.join(', ');
wl.appendChild(workRow(w,String(w.state).replace(/_/g,' '),w.needs_you?'warn':'',sub))});
add(all,wl,h('p','note','Read as of '+s.observed_at+'. Provider check times are shown separately. Reads are not one atomic snapshot.'),h('p','note','Evidence revision '+s.digest),h('p','note',(s.limits||[]).join(', ')));
add(root,all,h('p','note',manage))}

function onRefresh(){call({})}
function gist(){var g=document.querySelector('.big');return g&&g.textContent}
start();
</script></body></html>

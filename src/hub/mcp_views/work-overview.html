<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work overview</title>
<style>

*{box-sizing:border-box}body{margin:0;padding:4px;background:transparent;color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.c{position:relative;overflow:hidden;background:var(--frame);border-radius:20px;padding:16px 18px 12px}
.c::before{content:"";position:absolute;right:-80px;top:-120px;width:300px;height:300px;border-radius:50%;background:radial-gradient(closest-side,rgba(109,92,224,.45),transparent);pointer-events:none}
.c>*{position:relative}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.cu .head{display:flex;justify-content:flex-end;margin-bottom:4px}.cu .item{padding:7px 0;border-top:1px solid var(--line)}.cu .t{font-weight:500;overflow-wrap:anywhere}.cu .s{font-size:12px;color:var(--dim);overflow-wrap:anywhere}

var manage='Manage these views: ask your agent to run agentscm_view_settings, or open Settings in the hub.';
function start(){if(typeof ResizeObserver==='function')new ResizeObserver(size).observe(document.body);

var STATE={active:['Working','move','go'],blocked:['Blocked','block','bad'],handover:['Handover','hand','warn'],paused:['Paused','pause','']};
var NAMES={'claude-code':'Claude Code',codex:'Codex',cursor:'Cursor',copilot:'Copilot',gemini:'Gemini'},AGC={'claude-code':'#e8896a',codex:'#ece9ff',cursor:'#9a97b8',copilot:'#8b7cf0',gemini:'#6aa0ff'};

function who(i){var a=i.lead_agent;return a?own(NAMES,a)?NAMES[a]:a:i.owner_login||'unknown agent'}
function agc(i){return own(AGC,i.lead_agent)?AGC[i.lead_agent]:'#aaa5d2'}
function plural(n,a,b){return n+' '+(n===1?a:b||a+'s')}
function needs(cur,ov){var rows=[];
ov.forEach(function(p){var ps=(p.reasons||[]).map(function(r){return r.left_path===r.right_path?r.left_path:r.left_path+' / '+r.right_path}),shown=ps.slice(0,3).map(clip).join(', ')||'a path',more=ps.length>3?' and '+(ps.length-3)+' more':'';
rows.push({icon:'overlap',tone:'warn',t:who(p.left)+' and '+who(p.right)+' both declare '+shown+more+(p.reasons_complete===false?' (more paths not shown)':''),s:'Coordination signal, not a Git conflict.'})});
cur.forEach(function(i){var w=who(i),t='“'+clip(i.title)+'”';

function workRow(i,word,tone,sub){var li=h('li'),sw=h('span','ag');sw.style.setProperty('--c',agc(i));add(li,sw,h('span','t',clip(i.title)),h('span','st '+tone,word),h('span','s',sub));return li}
function render(root,d,at){
var cur=Array.isArray(d.current)?d.current:[],ov=Array.isArray(d.overlaps)?d.overlaps:[],rec=Array.isArray(d.recent)?d.recent:[];
var working=cur.filter(function(i){return i.state==='active'}).length,rows=needs(cur,ov),repo=cur[0]&&cur[0].repository;
add(root,bar('AgentSCM · '+(repo?clip(repo):'Work overview'),'Updated '+pad(at.getHours())+':'+pad(at.getMinutes())),failNote());
if(d.current_complete===false)add(root,msg('warn','Showing a partial list.'));
var big=h('p','big');add(big,plural(working,'agent')+' working. ');

var all=fold('all','All work',plural(cur.length,'task')+' · '+rec.length+' finished recently'),wl=h('ul','w');

cur.forEach(function(i){var st=own(STATE,i.state)?STATE[i.state]:[String(i.state),'move',''];wl.appendChild(workRow(i,st[0],st[2],who(i)+(i.owner_login?' for '+clip(i.owner_login):'')+(i.next_action?' · Next: '+clip(i.next_action):'')+(i.claim_status!=='active'?' · Claim '+i.claim_status+', stays claimed':'')+' · '+ago(i.last_checkin_at)))});

renderCatchup(root);

function onRefresh(){call({});narrativeCall()}
function when(at){return new Date(at*1000).toLocaleString()}
function pair(dl,label,value){var dd=h('dd');add(dd,h('code',null,value));add(dl,h('dt',null,label),dd)}
var NARRATIVE={value:null,busy:false,error:false,timer:null};
function narrativeReferences(v,ids,allowEmpty){if(!Array.isArray(v)||v.length>4||!allowEmpty&&!v.length)return false;var seen={};return !v.some(function(r){if(typeof r!=='string'||seen[r]||!Object.prototype.hasOwnProperty.call(ids,r))return true;seen[r]=true;return false})}
function narrativeValue(v){
if(!v||typeof v!=='object'||!safeText(v.id,100)||!safeText(v.digest,64)||['pending','generating','ready','failed'].indexOf(v.status)<0||!v.window||typeof v.window.complete!=='boolean'||!Array.isArray(v.sources)||v.sources.length>100||!Array.isArray(v.warnings)||v.warnings.length>20||v.warnings.some(function(w){return !safeText(w,1000)}))return null;
var w=v.window;if(w.subscriber!=='human'||nat(w.event_from)===null||nat(w.event_through)===null||w.event_from>w.event_through||nat(w.merge_from)===null||nat(w.merge_through)===null||w.merge_from>w.merge_through)return null;

v.warnings.forEach(function(w){add(d,msg('warn',w))});if(!v.window.complete)add(d,msg('warn','This briefing covers a bounded portion of the catch-up window; more records may exist.'));

else add(d,h('p','note',v.status==='failed'?'No generated briefing is available for this window. Check the reported warning; this page keeps checking for recovery.':v.status==='generating'?'A connected agent is writing this briefing.':'Waiting for a connected agent to write this briefing. The Hub does not launch a model.'));
add(d,h('p','note','Work events '+v.window.event_from+' → '+v.window.event_through+' · Merge observations '+v.window.merge_from+' → '+v.window.merge_through+'. Agent reporting is not independent verification or edit authority. Reading never marks review complete.'));add(root,d)}
function narrativeCall(){if(NARRATIVE.busy)return;clearTimeout(NARRATIVE.timer);NARRATIVE.busy=true;rpc('tools/call',{name:'agentscm_briefing_read',arguments:{subscriber:'human'}}).then(function(r){NARRATIVE.value=narrativeValue(parse(r));NARRATIVE.error=!NARRATIVE.value},function(){NARRATIVE.value=null;NARRATIVE.error=true}).finally(function(){NARRATIVE.busy=false;paint();NARRATIVE.timer=setTimeout(function(){if(!document.hidden)narrativeCall()},30000)})}
function catchClient(){var c=window.crypto;if(c&&typeof c.randomUUID==='function')return'mcp_'+c.randomUUID();if(c&&typeof c.getRandomValues==='function'){var b=c.getRandomValues(new Uint8Array(16)),s='';for(var i=0;i<b.length;i++)s+=b[i].toString(16).padStart(2,'0');return'mcp_'+s}return'mcp_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2)+'_'+Math.random().toString(36).slice(2)}

function catchCoord(v){if(!v||typeof v!=='object'||Array.isArray(v)||nat(v.seq)===null||nat(v.at)===null)return null;var kind=safeText(v.kind,64),request=safeText(v.request_id,64),title=safeText(v.title,500),status=safeText(v.status,64);return kind&&request&&title&&status?{seq:v.seq,at:v.at,kind:kind,request_id:request,title:title,status:status}:null}
function catchCoverage(v){if(!v||typeof v!=='object'||Array.isArray(v))return null;var source=v.source==='forge_pull'||v.source==='tracked_publication'?v.source:null,state=v.state==='observed_only'||v.state==='incomplete'||v.state==='unavailable'?v.state:null;if(!source||!state||v.checked_at!==null&&nat(v.checked_at)===null||nat(v.unread_pages)===null||nat(v.deferred)===null)return null;return{source:source,state:state,checked_at:v.checked_at,unread_pages:v.unread_pages,deferred:v.deferred}}
function catchupValue(v){if(!v||typeof v!=='object'||Array.isArray(v)||!/^cup_[0-9a-f]{32}$/.test(v.delivery)||!safeText(v.subscriber,255)||!safeText(v.delivery_client,200))return null;var ef=nat(v.event_from),et=nat(v.event_through),ea=nat(v.event_after),en=nat(v.next_event_after),mf=nat(v.merge_from),mt=nat(v.merge_through),ma=nat(v.merge_after),mn=nat(v.next_merge_after);if(ef===null||et===null||ea===null||en===null||mf===null||mt===null||ma===null||mn===null||ef>ea||ea>en||en>et||mf>ma||ma>mn||mn>mt)return null;if(!Array.isArray(v.work_events)||v.work_events.length>50||!Array.isArray(v.coordination_events)||v.coordination_events.length>50||!Array.isArray(v.merges)||v.merges.length>50||!Array.isArray(v.source_coverage)||v.source_coverage.length>2)return null;var work=v.work_events.map(catchWork),coord=v.coordination_events.map(catchCoord),merges=v.merges.map(catchMerge),coverage=v.source_coverage.map(catchCoverage);if(work.indexOf(null)>=0||coord.indexOf(null)>=0||merges.indexOf(null)>=0||coverage.indexOf(null)>=0)return null;var r=v.retention;if(!r||typeof r!=='object'||Array.isArray(r)||typeof r.work_gap!=='boolean'||typeof r.coordination_gap!=='boolean'||typeof r.merge_gap!=='boolean'||nat(r.event_available_from)===null||nat(r.merge_available_from)===null||typeof v.complete!=='boolean'||v.complete!==(en===et&&mn===mt))return null;var es=work.concat(coord).map(function(x){return x.seq}).sort(function(a,b){return a-b}),ms=merges.map(function(x){return x.seq});for(var i=0;i<es.length;i++)if(es[i]<=ea||es[i]>en||i&&es[i-1]>=es[i])return null;for(var j=0;j<ms.length;j++)if(ms[j]<=ma||ms[j]>mn||j&&ms[j-1]>=ms[j])return null;return{subscriber:v.subscriber,delivery_client:v.delivery_client,delivery:v.delivery,event_from:ef,event_through:et,event_after:ea,next_event_after:en,merge_from:mf,merge_through:mt,merge_after:ma,next_merge_after:mn,work_events:work,coordination_events:coord,merges:merges,retention:r,source_coverage:coverage,complete:v.complete}}
function appendCatch(a,b){if(!a||a.complete||!b||a.delivery!==b.delivery||a.subscriber!==b.subscriber||a.delivery_client!==b.delivery_client||a.event_from!==b.event_from||a.event_through!==b.event_through||a.merge_from!==b.merge_from||a.merge_through!==b.merge_through||a.next_event_after!==b.event_after||a.next_merge_after!==b.merge_after||JSON.stringify(a.retention)!==JSON.stringify(b.retention))return null;b.event_after=a.event_after;b.merge_after=a.merge_after;b.work_events=a.work_events.concat(b.work_events);b.coordination_events=a.coordination_events.concat(b.coordination_events);b.merges=a.merges.concat(b.merges);return b}
function catchButton(p){var gap=p&&(p.retention.work_gap||p.retention.coordination_gap||p.retention.merge_gap),label=p&&p.complete?(gap?'Mark available records reviewed':'Mark reviewed'):'Load more',b=h('button','btn',label);b.type='button';b.disabled=CATCH.busy||!p;b.addEventListener('click',function(){if(!p)return;if(p.complete)catchAck(p);else catchCall({subscriber:p.subscriber,delivery_client:CATCH_CLIENT,delivery:p.delivery,event_after:p.next_event_after,event_through:p.event_through,merge_after:p.next_merge_after,merge_through:p.merge_through},true)});return b}
function sd(rows,label){var src=h('details','sd'),dl=h('dl');rows.forEach(function(r){pair(dl,r[0],r[1])});add(src,h('summary',null,label||'Source details'),dl);return src}
function catchMergeRow(m){var x=h('li','item');add(x,h('div','t',m.title||'Pull request #'+m.pull_number),h('div','s','PR #'+m.pull_number+' · '+m.merge_commit.slice(0,12)+' · observed '+ago(m.observed_at)+(m.occurred_at===null?'':' · occurred '+ago(m.occurred_at))),sd([['Observation',m.id],['Source',m.source+' · '+m.source_id],['Branch → base',m.branch+' → '+m.base],['Head commit',m.head_commit],['Merge commit',m.merge_commit]]));return x}
function catchWorkRow(e){var x=h('li','item'),summary=e.item.current&&e.item.current.summary?e.item.current.summary:e.item.title;add(x,h('div','t',e.item.title),h('div','s',(e.item.lead_agent||'unknown agent')+' · '+summary+' · '+ago(e.at)),sd([['Work',e.work_id],['Event',e.seq+' · '+e.kind]]));return x}
function catchCoordRow(e){var x=h('li','item');add(x,h('div','t',e.title),h('div','s',e.status+' · '+ago(e.at)),sd([['Request',e.request_id],['Event',e.seq+' · '+e.kind]]));return x}
function catchGroup(box,label,items,row){if(!items.length)return;var u=h('ul');add(box,h('p','sh',items.length+' '+label+(items.length===1?'':'s')));items.forEach(function(item){u.appendChild(row(item))});add(box,u)}
function catchCoverageNote(box,c){if(c.state==='observed_only')return;var name=c.source==='forge_pull'?'Forge pull request':'Tracked publication',checked=c.checked_at===null?'No successful source check is recorded.':'Last checked '+when(c.checked_at)+'.',unread=c.unread_pages?' '+c.unread_pages+' source pages remain unread.':'',deferred=c.deferred?' '+c.deferred+' observations were deferred.':'';add(box,msg(c.state==='unavailable'?'warn':'',name+' source '+c.state+'. '+checked+unread+deferred))}
function renderCatchup(root){var p=CATCH.page,n=p?p.work_events.length+p.coordination_events.length+p.merges.length:0,box=fold('catch','Since you last checked',p?n+(p.complete?'':'+'):null),head=h('div','head');box.classList.add('cu');add(head,catchButton(p));add(box,head);
if(CATCH.note)add(box,CATCH.note.bad?msg('warn',CATCH.note.text):h('p','note',CATCH.note.text));
if(CATCH.err)add(box,msg('warn',(p?'Could not refresh catch-up. Showing the loaded delivery. ':'Catch-up unavailable. Current Work remains above; this is not an empty result or an all-clear. ')+CATCH.err));

add(box,h('p','note','Merge entries are immutable observations recorded by AgentSCM. Source status is observational and does not claim all forge history. Current unfinished Work and coordination warnings remain above.'),sd([['Delivery',p.delivery],['Work events',p.event_from+' → '+p.event_through],['Merge observations',p.merge_from+' → '+p.merge_through]],'Delivery details'));add(root,box)}
function catchCall(args,append){if(CATCH.busy)return;CATCH.busy=true;CATCH.err=null;paint();rpc('tools/call',{name:CATCHUP_TOOL,arguments:args}).then(function(r){var p=catchupValue(parse(r));if(!p||p.delivery_client!==CATCH_CLIENT){CATCH.err='The tool returned an invalid delivery.'}else if(append){var joined=appendCatch(CATCH.page,p);if(joined)CATCH.page=joined;else CATCH.err='The continuation did not match the fixed delivery.'}else CATCH.page=p;CATCH.busy=false;paint()},function(){CATCH.busy=false;CATCH.err='The catch-up tool call failed.';paint()})}

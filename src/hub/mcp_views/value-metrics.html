</style></head><body><main id="app"></main><script>"use strict";

var accounting=h('div'),totals=h('dl','technical');pair(totals,'Raw input tokens',r.input_tokens==null?'Unknown':r.input_tokens,true);pair(totals,'Raw output tokens',r.output_tokens==null?'Unknown':r.output_tokens,true);add(accounting,totals,h('p','section-note','Token and missing-cost totals include additive request reports only. Other usage remains unallocated. Accounting bases and currencies stay separate.'));(r.costs||[]).forEach(function(cost){var dl=h('dl','technical');pair(dl,'Provider / model',cost.provider+' / '+cost.model);pair(dl,'Accounting kind',words(cost.kind));pair(dl,'Currency',cost.currency);pair(dl,'Amount in micros',cost.amount_micros,true);pair(dl,'Basis',cost.basis,true);pair(dl,'Requests',quantity(cost.requests));add(accounting,dl)});
var usages=h('ul','usage-list');(r.groups||[]).forEach(function(group){var item=h('li'),dl=h('dl','technical');add(item,h('p',null,group.provider+' · '+group.model+' · '+words(group.category)));pair(dl,'Usage basis',words(group.usage_basis));pair(dl,'Input / output',quantity(group.input_tokens)+' / '+quantity(group.output_tokens)+' tokens');pair(dl,'Cache read input',quantity(group.cache_read_input_tokens));pair(dl,'Cache creation input',quantity(group.cache_creation_input_tokens));pair(dl,'Requests',quantity(group.requests));add(item,dl);usages.appendChild(item)});add(accounting,usages);add(box,disclosure('Accounting and usage details',accounting,'section-extra'));return box}

add(grid,section('Issues surfaced',[[i.unresolved,'Unresolved',i.unresolved>0?'attention':null],[i.resolved,'Resolved']],[[i.dismissed,'Dismissed',null,true],[i.false_trigger,'False triggers',null,true]],'A check or refusal signal does not prove a bug was prevented.'+unknownNote(i)),section('Follow-up evidence',[[f.current,'Current'],[f.pending,'Pending']],[[f.failed,'Failed',f.failed>0?'failure':null,true],[f.stale,'Stale',f.stale>0?'attention':null],[f.cancelled,'Cancelled',null,true],[f.unknown,'Unknown']],'Current evidence applies to its own source, recipe and policy.'+unknownNote(f)),section('Team context',[[c.returned,'Prepared for return'],[c.acknowledged,'Acknowledged']],[[c.applied,'Applied']],'A prepared response does not prove transport receipt or application.'+unknownNote(c)),resources(r));add(root,grid);
var evidence=h('section','evidence'),eh=h('div','section-heading'),evidenceItems=h('div');add(eh,h('h2',null,'Recorded evidence'));add(evidence,eh);if(!(d.evidence||[]).length)add(evidence,h('p','empty-evidence','No retained evidence in this scope and period. Contributions remain unobserved.'));else(d.evidence||[]).forEach(function(e){evidenceItems.appendChild(evidenceRow(e))});if(d.next_after!=null){var more=h('button','refresh page-button','Next evidence page');more.type='button';more.addEventListener('click',function(){call({since:d.since,until:d.until,after:d.next_after,limit:20})});evidenceItems.appendChild(more)}if((d.evidence||[]).length||d.next_after!=null)add(evidence,disclosure('Inspect '+(d.evidence||[]).length+' evidence records',evidenceItems,'evidence-group'));add(root,evidence);
